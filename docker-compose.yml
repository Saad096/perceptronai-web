services:
  qentrixai-web:
    container_name: qentrixai-web
    build:
      context: .
      dockerfile: Dockerfile
    image: qentrixai-web:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - qentrixai-net

networks:
  qentrixai-net:
    driver: bridge
